<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AI Chat Widget</title>

<style>
/* Botón flotante */
#chat-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ff6b35;
  color: white;
  border: none;
  border-radius: 50%;
  width: 60px;
  height: 60px;
  font-size: 24px;
  cursor: pointer;
}

/* Contenedor chat */
#chat-container {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 320px;
  height: 450px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
  display: none;
  flex-direction: column;
}

/* Header */
#chat-header {
  background: #4a90e2;
  color: white;
  padding: 10px;
  border-radius: 10px 10px 0 0;
  display: flex;
  justify-content: space-between;
}

/* Mensajes */
#chat-messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  font-family: sans-serif;
}

/* Input */
#chat-input {
  display: flex;
  border-top: 1px solid #ddd;
}

#chat-input input {
  flex: 1;
  padding: 10px;
  border: none;
}

#chat-input button {
  background: #ff6b35;
  border: none;
  color: white;
  padding: 10px;
  cursor: pointer;
}

/* Mensajes */
.msg-user {
  text-align: right;
  margin: 5px;
}

.msg-bot {
  text-align: left;
  margin: 5px;
}
</style>
</head>

<body>

<button id="chat-toggle">💬</button>

<div id="chat-container">
  <div id="chat-header">
    <span>AI Assistant</span>
    <button onclick="toggleChat()">✖</button>
  </div>

  <div id="chat-messages">
    <div class="msg-bot">👋 Bienvenido, ¿en qué puedo ayudarte?</div>
  </div>

  <div id="chat-input">
    <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const API_URL = "http://localhost:8001/premium-agent"; // tu backend

let sessionId = "chat-" + Date.now();

function toggleChat() {
  const chat = document.getElementById("chat-container");
  chat.style.display = chat.style.display === "flex" ? "none" : "flex";
}

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = sender === "user" ? "msg-user" : "msg-bot";
  div.innerText = text;
  document.getElementById("chat-messages").appendChild(div);
}

async function sendMessage() {
  const input = document.getElementById("userInput");
  const message = input.value;
  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  const body = {
    session_id: sessionId,
    user_message: message,
    lead_state: null,
    conversation_history: [],
    catalog_context: ""
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    addMessage(data.assistant_reply, "bot");

  } catch (error) {
    addMessage("Error conectando con el servidor", "bot");
  }
}
</script>

</body>
</html>
