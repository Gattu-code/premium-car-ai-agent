<script>
const urlParams = new URLSearchParams(window.location.search);
const sessionId = urlParams.get("session") || "chat-" + Date.now();
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");
const sessionBadge = document.getElementById("sessionBadge");

sessionBadge.textContent = `Sesión: ${sessionId}`;

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function addMessage(role, text) {
  const row = document.createElement("div");
  row.className = `message-row ${role}`;

  const bubble = document.createElement("div");
  bubble.className = `message ${role}`;
  bubble.innerHTML = escapeHtml(text);

  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function addTypingIndicator() {
  const row = document.createElement("div");
  row.className = "message-row agent";
  row.id = "typingRow";

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = `
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  `;

  row.appendChild(typing);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTypingIndicator() {
  const typingRow = document.getElementById("typingRow");
  if (typingRow) typingRow.remove();
}

async function sendMessage() {
  const message = input.value.trim();
  if (!message) return;

  addMessage("user", message);
  input.value = "";
  input.focus();
  sendButton.disabled = true;
  addTypingIndicator();

  try {
    const res = await fetch("http://localhost:5678/webhook/premium-car-agent", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        session_id: sessionId,
        message: message
      })
    });

    const text = await res.text();

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${text}`);
    }

    if (!text) {
      throw new Error("Respuesta vacía");
    }

    const data = JSON.parse(text);

    removeTypingIndicator();

    const reply = data.reply || "No se recibió respuesta del agente.";
    addMessage("agent", reply);

    if (data.next_action === "request_contact_info") {
      addMessage(
        "agent",
        "Si quieres, puedes compartir tu número en el siguiente mensaje para continuar con la orientación."
      );
    }

  } catch (error) {
    removeTypingIndicator();
    console.error("🔥 ERROR COMPLETO:", error);

    addMessage(
      "agent",
      "Estoy teniendo un inconveniente técnico. Intenta nuevamente en unos segundos."
    );
  } finally {
    sendButton.disabled = false;
    input.focus();
  }
}

// ✅ LISTENERS CORRECTOS (FUERA de la función)
sendButton.addEventListener("click", sendMessage);

input.addEventListener("keypress", function (e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});
</script>
