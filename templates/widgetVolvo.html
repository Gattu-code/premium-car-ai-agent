<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget Volvo Colombia</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #6f6f6f;
      --line: #e8e8e8;
      --soft: #f7f7f7;
      --shadow: 0 14px 32px rgba(0,0,0,0.18);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    body {
      overflow: hidden;
    }

    .chat-launcher {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 9999;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      padding: 0;
    }

    .chat-launcher:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(0,0,0,0.22);
    }

    .chat-launcher img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      display: block;
    }

    .chat-window {
      position: fixed;
      right: 28px;
      bottom: 156px;
      width: 590px;
      max-width: calc(100vw - 32px);
      height: 620px;
      max-height: calc(100vh - 180px);
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      box-shadow: 0 28px 60px rgba(0,0,0,0.20);
      z-index: 9998;
    }

    .chat-window.open {
      display: flex;
    }

    .chat-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .chat-brand {
      font-size: 13px;
      letter-spacing: 7px;
      margin-bottom: 8px;
    }

    .chat-title {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .chat-subtitle {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .chat-close {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #ffffff;
      color: #111111;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .chat-close:hover {
      background: #fafafa;
    }

    .chat-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-reset {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #ffffff;
      color: #111111;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .chat-reset:hover {
      background: #fafafa;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      background: #fcfcfc;
    }

    .message {
      max-width: 84%;
      margin-bottom: 12px;
      padding: 13px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.bot {
      background: #f6f6f6;
      border: 1px solid #ededed;
      color: var(--text);
      border-top-left-radius: 6px;
    }

    .message.user {
      margin-left: auto;
      background: #97bbe969;
      color: #0e0d0d;
      border-top-right-radius: 6px;
    }

    .message.system {
      max-width: 100%;
      background: #fff7f5;
      border: 1px solid #efc7bb;
      color: #8a3d2e;
      font-size: 13px;
    }

    .quick-replies {
      padding: 12px 14px 8px;
      border-top: 1px solid var(--line);
      background: #ffffff;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .quick-reply {
      flex: 0 0 auto;
      border: 1px solid #dcdcdc;
      background: #ffffff;
      color: #111111;
      border-radius: 999px;
      padding: 10px 13px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .quick-reply:hover {
      background: #f6f6f6;
      border-color: #bdbdbd;
    }

    .quick-reply.primary {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
      font-weight: 700;
    }

    .chat-form {
      display: flex;
      gap: 10px;
      padding: 10px 14px 14px;
      background: #ffffff;
    }

    .chat-form input {
      flex: 1;
      border: 1px solid #d9d9d9;
      border-radius: 999px;
      padding: 14px 16px;
      font-size: 14px;
      outline: none;
    }

    .chat-form input:focus {
      border-color: #b9b9b9;
    }

    .chat-form button {
      width: 92px;
      border: none;
      border-radius: 999px;
      background: #000000;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 14px 16px;
    }

    .chat-form button:hover {
      opacity: 0.92;
    }

    @media (max-width: 640px) {
      .chat-launcher {
        right: 16px;
        bottom: 16px;
        width: 96px;
        height: 96px;
      }

      .chat-launcher img {
        width: 52px;
        height: 52px;
      }

      .chat-window {
        right: 16px;
        bottom: 126px;
        width: calc(100vw - 32px);
        height: 540px;
        max-height: calc(100vh - 150px);
      }
    }
  </style>
</head>

      timeframe: "Gracias. ¿En qué plazo estás pensando comprar?",
      contact: "Con esta información ya podemos orientar mejor la asesoría.",
      end: "Gracias. Un asesor podrá continuar con tu solicitud."
    };

    const chatLauncher = document.getElementById("chatLauncher");
    const chatWindow = document.getElementById("chatWindow");
    const chatClose = document.getElementById("chatClose");
    const chatReset = document.getElementById("chatReset");
    const chatMessages = document.getElementById("chatMessages");
    const quickReplies = document.getElementById("quickReplies");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");

    chatLauncher.addEventListener("click", async () => {
      if (chatWindow.classList.contains("open")) {
        closeChat();
      } else {
        await openChat();
      }
    });

    chatClose.addEventListener("click", () => {
      closeChat();
    });

    chatReset.addEventListener("click", () => {
      resetConversation();
    });

    window.addEventListener("load", async () => {
      if (state.isOpen) {
        await openChat();
      }
    });

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = chatInput.value.trim();
      if (!text) return;

      await handleUserMessage(text, state.step, "free_text");
      chatInput.value = "";
      keepChatOpen();
    });

    async function openChat() {
      chatWindow.classList.add("open");
      state.isOpen = true;
      localStorage.setItem(STORAGE_KEYS.open, "true");

      if (!state.hasLoadedSession) {
        state.hasLoadedSession = true;

        if (state.messages.length > 0) {
          restoreMessages();
        } else {
          addMessage("bot", stepIntro.start);
        }

        renderInitialQuickReplies();

        if (LOAD_PREVIOUS_SESSION) {
          await loadPreviousSession();
        }
      }

      setTimeout(() => chatInput.focus(), 50);
    }

    function closeChat() {
      chatWindow.classList.remove("open");
      state.isOpen = false;
      localStorage.setItem(STORAGE_KEYS.open, "false");
    }

    function keepChatOpen() {
      chatWindow.classList.add("open");
      state.isOpen = true;
      localStorage.setItem(STORAGE_KEYS.open, "true");
    }


    function renderQuickReplies(replies = []) {
      quickReplies.innerHTML = "";

      if (!Array.isArray(replies) || replies.length === 0) {
        quickReplies.style.display = "none";
        return;
      }

      quickReplies.style.display = "flex";

      replies.slice(0, 4).forEach((reply, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "quick-reply" + (index === 0 ? " primary" : "");
        button.textContent = reply;

        button.addEventListener("click", async () => {
          quickReplies.innerHTML = "";
          quickReplies.style.display = "none";

          await handleUserMessage(
            reply,
            "dynamic",
            "quick_reply",
            {
              selectedLabel: reply
            },
            reply
          );

          keepChatOpen();
        });

        quickReplies.appendChild(button);
      });
    }



    async function handleUserMessage(text, nextStep, inputType, extraMetadata = {}, displayText = null) {
      const currentStep = extraMetadata.previousStep || state.step;
      const userDisplay = displayText || text;

      addMessage("user", userDisplay);
      addToConversationHistory("user", text);

      addMessage("bot", "Procesando...", false);

      try {
        const payload = {
          // Compatibilidad con el flujo n8n anterior
          action: "sendMessage",
          sessionId: state.sessionId,
          route: ROUTE,
          chatInput: text,

          // Compatibilidad con Normalize Input / FastAPI actual
          session_id: state.sessionId,
          message: text,
          lead_state: state.leadState || {},
          conversation_history: state.conversationHistory.slice(-10),
          catalog_context: "",

          metadata: {
            source: "widgetvolvo",
            userId: "",
            mode: "hybrid_input_and_quick_replies",
            inputType: inputType,
            currentStep: currentStep,
            nextStep: nextStep,
            ...extraMetadata
          }
        };

        const data = await postToN8n(payload);

        removeProcessingMessage();

        const output = extractOutput(data);

        if (output) {
          addMessage("bot", output);
          addToConversationHistory("assistant", output);
        }

        mergeLeadState(extractUpdatedLeadState(data));

        const backendQuickReplies = extractQuickReplies(data);
        renderQuickReplies(backendQuickReplies);

        persistState();
        keepChatOpen();

        return output;

      } catch (error) {
        removeProcessingMessage();
        console.error("Widget error:", error);
        addMessage("system", "No se pudo conectar con n8n. Verifica que el workflow esté activo y que la URL del webhook sea correcta.");
        keepChatOpen();
        return "";
      }
    }

    async function loadPreviousSession() {
      const payload = {
        action: "loadPreviousSession",
        sessionId: state.sessionId,
        session_id: state.sessionId,
        route: ROUTE,
        chatInput: "",
        message: "",
        lead_state: state.leadState || {},
        conversation_history: state.conversationHistory.slice(-10),
        catalog_context: "",
        metadata: {
          source: "widgetvolvo",
          userId: "",
          mode: "hybrid_input_and_quick_replies"
        }
      };

      try {
        const data = await postToN8n(payload);
        const output = extractOutput(data);

        if (output) {
          addMessage("bot", output);
          addToConversationHistory("assistant", output);
        }

        mergeLeadState(extractUpdatedLeadState(data));
        persistState();
        keepChatOpen();

        return output;
      } catch (error) {
        return "";
      }
    }

    async function postToN8n(payload) {
      const response = await fetch(state.webhookUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error("HTTP " + response.status + ": " + errorText);
      }

      const text = await response.text();

      if (!text) {
        return {};
      }

      try {
        return JSON.parse(text);
      } catch {
        return { output: text };
      }
    }

    function extractOutput(data) {
      if (!data) return "";

      if (typeof data === "string") {
        return data;
      }

      if (Array.isArray(data)) {
        return extractOutput(data[0]);
      }

      return (
        data.assistant_reply ||
        data.output ||
        data.reply ||
        data.message ||
        data.response ||
        data.text ||
        data.answer ||
        data.json?.assistant_reply ||
        data.json?.output ||
        data.json?.reply ||
        data.json?.message ||
        data.json?.response ||
        data.data?.assistant_reply ||
        data.data?.output ||
        data.body?.assistant_reply ||
        data.body?.output ||
        ""
      );
    }

    function extractUpdatedLeadState(data) {
      if (!data) return {};

      if (Array.isArray(data)) {
        return extractUpdatedLeadState(data[0]);
      }

      return (
        data.updated_lead_state ||
        data.lead_state ||
        data.json?.updated_lead_state ||
        data.data?.updated_lead_state ||
        data.body?.updated_lead_state ||
        {}
      );
    }

    function extractQuickReplies(data) {
      if (!data) return [];

      if (Array.isArray(data)) {
        return extractQuickReplies(data[0]);
      }

      const replies =
        data.quick_replies ||
        data.quickReplies ||
        data.json?.quick_replies ||
        data.data?.quick_replies ||
        data.body?.quick_replies ||
        [];

      if (!Array.isArray(replies)) {
        return [];
      }

      return replies
        .map(reply => String(reply || "").trim())
        .filter(reply => reply)
        .slice(0, 4);
    }


    function mergeLeadState(updatedLeadState) {
      if (!updatedLeadState || typeof updatedLeadState !== "object") {
        return;
      }

      Object.entries(updatedLeadState).forEach(([key, value]) => {
        const hasValue =
          value !== "" &&
          value !== null &&
          value !== undefined &&
          !(Array.isArray(value) && value.length === 0);

        if (hasValue) {
          state.leadState[key] = value;
        }
      });

      localStorage.setItem(STORAGE_KEYS.leadState, JSON.stringify(state.leadState));
    }

    function addMessage(type, text, persist = true) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chatMessages.appendChild(message);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      if (persist && text !== "Procesando...") {
        state.messages.push({ type, text });
        state.messages = state.messages.slice(-60);
        localStorage.setItem(STORAGE_KEYS.messages, JSON.stringify(state.messages));
      }
    }

    function restoreMessages() {
      chatMessages.innerHTML = "";
      state.messages.forEach((item) => {
        addMessage(item.type, item.text, false);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addToConversationHistory(role, content) {
      state.conversationHistory.push({ role, content });
      state.conversationHistory = state.conversationHistory.slice(-14);
      localStorage.setItem(STORAGE_KEYS.conversationHistory, JSON.stringify(state.conversationHistory));
    }

    function persistState() {
      localStorage.setItem(STORAGE_KEYS.conversationHistory, JSON.stringify(state.conversationHistory.slice(-14)));
      localStorage.setItem(STORAGE_KEYS.leadState, JSON.stringify(state.leadState || {}));
      localStorage.setItem(STORAGE_KEYS.messages, JSON.stringify(state.messages.slice(-60)));
      localStorage.setItem(STORAGE_KEYS.sessionId, state.sessionId);
      localStorage.setItem(STORAGE_KEYS.step, state.step);
    }

    function getStoredMessages() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.messages)) || [];
      } catch {
        return [];
      }
    }

    function getStoredConversationHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.conversationHistory)) || [];
      } catch {
        return [];
      }
    }

    function getStoredLeadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.leadState)) || {};
      } catch {
        return {};
      }
    }

    function resetConversation() {
      localStorage.removeItem(STORAGE_KEYS.messages);
      localStorage.removeItem(STORAGE_KEYS.step);
      localStorage.removeItem(STORAGE_KEYS.sessionId);
      localStorage.removeItem(STORAGE_KEYS.leadState);
      localStorage.removeItem(STORAGE_KEYS.conversationHistory);

      state.messages = [];
      state.conversationHistory = [];
      state.leadState = {};
      state.step = "start";
      state.hasLoadedSession = true;

      state.sessionId = crypto.randomUUID
        ? crypto.randomUUID()
        : "session-" + Date.now() + "-" + Math.random().toString(16).slice(2);

      localStorage.setItem(STORAGE_KEYS.sessionId, state.sessionId);
      localStorage.setItem(STORAGE_KEYS.step, "start");
      localStorage.setItem(STORAGE_KEYS.open, "true");

      chatMessages.replaceChildren();
      quickReplies.replaceChildren();

      addMessage("bot", stepIntro.start);
      renderInitialQuickReplies();
      keepChatOpen();

      chatMessages.scrollTop = chatMessages.scrollHeight;
      setTimeout(() => chatInput.focus(), 50);
    }

    function renderInitialQuickReplies() {
      const initialReplies = [
        "SUV eléctrico",
        "Híbrido enchufable",
        "Agendar visita",
        "Hablar con asesor"
      ];

      renderQuickReplies(initialReplies);
    }


    function removeProcessingMessage() {
      const botMessages = Array.from(chatMessages.querySelectorAll(".message.bot"));
      const lastBotMessage = botMessages[botMessages.length - 1];

      if (lastBotMessage && lastBotMessage.textContent === "Procesando...") {
        lastBotMessage.remove();
      }
    }

    window.addEventListener("error", (event) => {
      console.error("Widget error:", event.error || event.message);
    });

    function getOrCreateSessionId() {
      let sessionId = localStorage.getItem(STORAGE_KEYS.sessionId);

      if (!sessionId) {
        sessionId = crypto.randomUUID
          ? crypto.randomUUID()
          : "session-" + Date.now() + "-" + Math.random().toString(16).slice(2);

        localStorage.setItem(STORAGE_KEYS.sessionId, sessionId);
      }

      return sessionId;
    }
  </script>
</body>
</html>
